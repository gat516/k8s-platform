name: CI/CD Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Finish an in-progress release, including recovery, before starting another.
concurrency:
  group: cicd-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: cd src && go test ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend/dashboard

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          # Keep scanner compilation separate from the test job's cache.
          cache-dependency-path: |
            src/go.sum
            scripts/ci-tools.versions
      - name: Cache security scanners
        id: scanners
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/govulncheck
            ~/go/bin/gosec
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/go.mod', 'scripts/ci-tools.versions') }}
      - name: Install security scanners
        if: steps.scanners.outputs.cache-hit != 'true'
        run: |
          source scripts/ci-tools.versions
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION"
      - name: govulncheck (known-vulnerable dependencies)
        run: cd src && govulncheck ./...
      - name: gosec (static analysis)
        run: cd src && gosec ./...

  build:
    needs: [test, scan, web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gat516/k8s-platform:${{ steps.vars.outputs.sha_short }}
          build-args: VERSION=${{ steps.vars.outputs.sha_short }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The retired cluster is gone. Enable only after configuring and testing
    # replacement credentials/network access; AWS currently uses private SSM access.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DASHBOARD_DEPLOY_ENABLED == 'true'
    env:
      # This workflow deploys the dashboard. qireadr keeps its own workflow.
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment target
        run: |
          if [ "$DEPLOY_HEALTH_URL" != 'https://status.qireadr.com/health' ]; then
            echo 'Set DEPLOY_HEALTH_URL=https://status.qireadr.com/health before enabling deployment.' >&2
            exit 1
          fi
      - name: Set up kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > /tmp/kubeconfig.yaml
          chmod 600 /tmp/kubeconfig.yaml
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'
      - name: Capture previous release
        id: previous
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
        run: python3 scripts/release.py capture --health-url "$DEPLOY_HEALTH_URL" >> "$GITHUB_OUTPUT"
      - name: Deploy to cluster
        id: release
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
        run: |
          kubectl apply -f manifests/rbac.yaml
          sed "s|ghcr.io/gat516/k8s-platform:SHA|ghcr.io/gat516/k8s-platform:${{ needs.build.outputs.sha_short }}|" manifests/deployment.yaml | kubectl apply -f -
          kubectl apply -f manifests/service.yaml
          kubectl apply -f manifests/ingressroute.yaml
          kubectl rollout status deployment/k8s-platform --timeout=120s
      - name: Verify release
        id: verify
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.sha_short }}
        run: python3 scripts/release.py verify --health-url "$DEPLOY_HEALTH_URL" --version "$EXPECTED_VERSION"
      - name: Restore and verify previous release
        if: ${{ failure() && steps.previous.outputs.previous_revision != '' && (steps.release.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        env:
          KUBECONFIG: /tmp/kubeconfig.yaml
          PREVIOUS_REVISION: ${{ steps.previous.outputs.previous_revision }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.previous_version }}
        run: python3 scripts/release.py rollback --health-url "$DEPLOY_HEALTH_URL" --revision "$PREVIOUS_REVISION" --version "$PREVIOUS_VERSION"
      - name: Cleanup kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig.yaml
