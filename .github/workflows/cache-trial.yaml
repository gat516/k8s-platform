# Temporary experiment: identical source/checks, no deployment job.
# A different VERSION on each attempt forces the Go link step to run again.
name: CI cache trial
on:
  workflow_call:
    inputs:
      cache_mode:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: ${{ inputs.cache_mode != 'baseline' }}
          cache-dependency-path: src/go.sum
      - run: cd src && go test ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend/dashboard

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: ${{ inputs.cache_mode != 'baseline' }}
          # Keep scanner compilation separate from the test job's cache.
          cache-dependency-path: |
            src/go.sum
            scripts/ci-tools.versions
      - name: Cache security scanners
        if: inputs.cache_mode != 'baseline'
        id: scanners
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/govulncheck
            ~/go/bin/gosec
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/go.mod', 'scripts/ci-tools.versions') }}
      - name: Install security scanners
        if: steps.scanners.outputs.cache-hit != 'true'
        run: |
          source scripts/ci-tools.versions
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION"
      - name: govulncheck (known-vulnerable dependencies)
        run: cd src && govulncheck ./...
      - name: gosec (static analysis)
        run: cd src && gosec ./...

  build:
    needs: [test, scan, web]
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set short SHA
        id: vars
        run: echo "sha_short=benchmark-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: inputs.cache_mode == 'full'
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gat516/k8s-platform:${{ steps.vars.outputs.sha_short }}-${{ inputs.cache_mode }}
          build-args: VERSION=${{ steps.vars.outputs.sha_short }}
          cache-from: ${{ inputs.cache_mode == 'full' && 'type=gha,scope=cicd-dashboard-benchmark' || '' }}
          cache-to: ${{ inputs.cache_mode == 'full' && 'type=gha,scope=cicd-dashboard-benchmark,mode=max' || '' }}
