apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k8s-platform
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    # The whole dashboard shares one origin. Metrics and legacy APIs stay private.
    - match: Host(`status.qireadr.com`) && (Path(`/`) || PathPrefix(`/assets/`) || Path(`/health`) || Path(`/api/v1/dashboard`))
      kind: Rule
      services:
        - name: k8s-platform
          port: 8080
  tls:
    # Reuse qireadr's existing resolver; do not replace its Traefik Helm config.
    certResolver: letsencrypt
