apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-platform
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-platform
  template:
    metadata:
      labels:
        app: k8s-platform
    spec:
      enableServiceLinks: false
      serviceAccountName: k8s-platform
      # The CI/CD Dashboard reads GitHub and HTTP health, not the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: k8s-platform
          # CI overrides this tag with the short git SHA on every deploy
          image: ghcr.io/gat516/k8s-platform:SHA
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APPLICATION_NAME
              value: qireadr
            - name: ACTIONS_REPOSITORY
              value: gat516/book
            - name: ACTIONS_WORKFLOW
              value: ci.yml
            - name: ACTIONS_BRANCH
              value: main
            - name: SERVICE_HEALTH_URL
              value: https://qireadr.com/api/healthz
            - name: ACTIONS_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cicd-dashboard-github
                  key: token
                  optional: true
            - name: ENVIRONMENT
              value: production
            - name: CORS_ORIGINS
              value: https://status.qireadr.com
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 200m
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
